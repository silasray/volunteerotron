{% extends "base.html" %}
{% block title %}Admin{% endblock %}
{% block content %}
  <form method="post" action="{{ url_for('admin.logout') }}" class="logout">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <span>Signed in as {{ user.name }}</span>
    <button type="submit">Sign out</button>
  </form>
{% endblock %}
