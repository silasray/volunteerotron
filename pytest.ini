[pytest]
testpaths = tests
# importlib mode: test dirs named api/ and web/ don't shadow the real packages.
addopts = --import-mode=importlib -ra
pythonpath = .
markers =
    postgres: runs on Postgres (Docker or TEST_DATABASE_URL; see tests/postgres/conftest.py); skipped without one
    browser: runs page scripts in headless Edge or Chrome (see tests/browser/conftest.py); skipped without one
